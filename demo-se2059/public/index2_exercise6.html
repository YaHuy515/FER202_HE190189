<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS từ node_modules -->
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons CDN (dùng cho icon giỏ hàng) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Exercise 6 - Bootstrap Grid</title>
    <style>
        /* CSS tạo nhãn Sale chéo góc */
        .card-sale-container {
            position: relative;
            overflow: hidden;
        }
        .badge-sale {
            position: absolute;
            top: 15px;
            right: -30px;
            background-color: #ff9900;
            color: #fff;
            padding: 2px 30px;
            transform: rotate(45deg);
            font-weight: bold;
            font-size: 12px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- 1. Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-secondary" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-secondary" href="#" role="button" data-bs-toggle="dropdown">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 2. Slider Banner (Carousel) -->
    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://via.placeholder.com/1920x530/cccccc/666666?text=1920+x+530" class="d-block w-100" alt="Banner 1">
            </div>
            <div class="carousel-item">
                <img src="https://via.placeholder.com/1920x530/bbbbbb/555555?text=1920+x+530" class="d-block w-100" alt="Banner 2">
            </div>
            <div class="carousel-item">
                <img src="https://via.placeholder.com/1920x530/aaaaaa/444444?text=1920+x+530" class="d-block w-100" alt="Banner 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- 3. New Product Section -->
    <div class="container my-5">
        <div class="mb-3">
            <h5 class="text-secondary fw-bold mb-0">NEW PRODUCT</h5>
            <small class="text-muted">List product description</small>
        </div>

        <!-- Layout Grid: 4 Cột (col-md-3) -->
        <div class="row g-3">
            
            <!-- Item 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 rounded-0 border">
                    <img src="https://via.placeholder.com/280x280/cccccc/666666?text=280+x+280" class="card-img-top rounded-0" alt="Product">
                    <div class="card-body p-2">
                        <h6 class="card-title text-secondary mb-1">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-decoration-line-through text-muted small">100.000 vnd</span>
                            <span class="text-warning fw-bold small">80.000 vnd</span>
                        </div>
                        <button class="btn btn-primary btn-sm rounded-0">
                            <i class="bi bi-cart-fill me-1"></i>Xem chi tiết
                        </button>
                    </div>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 rounded-0 border">
                    <img src="https://via.placeholder.com/280x280/cccccc/666666?text=280+x+280" class="card-img-top rounded-0" alt="Product">
                    <div class="card-body p-2">
                        <h6 class="card-title text-secondary mb-1">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-decoration-line-through text-muted small">100.000 vnd</span>
                            <span class="text-warning fw-bold small">80.000 vnd</span>
                        </div>
                        <button class="btn btn-primary btn-sm rounded-0">
                            <i class="bi bi-cart-fill me-1"></i>Xem chi tiết
                        </button>
                    </div>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 rounded-0 border">
                    <img src="https://via.placeholder.com/280x280/cccccc/666666?text=280+x+280" class="card-img-top rounded-0" alt="Product">
                    <div class="card-body p-2">
                        <h6 class="card-title text-secondary mb-1">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-decoration-line-through text-muted small">100.000 vnd</span>
                            <span class="text-warning fw-bold small">80.000 vnd</span>
                        </div>
                        <button class="btn btn-primary btn-sm rounded-0">
                            <i class="bi bi-cart-fill me-1"></i>Xem chi tiết
                        </button>
                    </div>
                </div>
            </div>

            <!-- Item 4 (Có badge Sale) -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 rounded-0 border card-sale-container">
                    <div class="badge-sale">Sale</div>
                    <img src="https://via.placeholder.com/280x280/cccccc/666666?text=280+x+280" class="card-img-top rounded-0" alt="Product">
                    <div class="card-body p-2">
                        <h6 class="card-title text-secondary mb-1">Product</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-decoration-line-through text-muted small">100.000 vnd</span>
                            <span class="text-warning fw-bold small">80.000 vnd</span>
                        </div>
                        <button class="btn btn-primary btn-sm rounded-0">
                            <i class="bi bi-cart-fill me-1"></i>Xem chi tiết
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle JS từ node_modules (chứa cả Popper.js cho Dropdown & Carousel hoạt động) -->
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
