<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Exercise 8: Demo about Form Control</title>
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 520px;">
        
        <!-- Khung Form dạng Card có Alert trên đầu đúng theo sơ đồ đề bài -->
        <div class="card border shadow-sm rounded-2 overflow-hidden bg-white">
            
            <!-- Alert bar màu vàng có nút đóng (x) ở trên cùng (12 cột) -->
            <div class="alert alert-warning alert-dismissible fade show rounded-0 mb-0 py-2 px-3 border-0 border-bottom" role="alert" style="background-color: #fef3d6;">
                <span class="small text-warning-emphasis"></span>
                <button type="button" class="btn-close py-2 px-3" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card-body p-4 pt-3">
                <!-- Tiêu đề Form (12 cột) -->
                <h2 class="fw-bold mb-3 text-dark">Form đặt vé máy bay</h2>

                <!-- Form đặt vé -->
                <form>
                    <!-- 1. Họ tên -->
                    <div class="mb-3">
                        <label for="hoten" class="form-label mb-1 fw-semibold text-secondary">Họ tên</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" id="hoten" placeholder="Họ tên">
                            <span class="input-group-text bg-light text-secondary">vnđ</span>
                        </div>
                        <div class="form-text text-muted">Phải nhập 5 ký tự, in hoa...</div>
                    </div>

                    <!-- 2. Địa chỉ -->
                    <div class="mb-3">
                        <label for="diachi" class="form-label mb-1 fw-semibold text-secondary">Địa chỉ</label>
                        <input type="text" class="form-control" id="diachi" placeholder="Địa chỉ">
                        <div class="form-text text-muted">Phải nhập 5 ký tự, in hoa...</div>
                    </div>

                    <!-- 3. Đi từ & Đến (row col-6) -->
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label for="ditu" class="form-label mb-1 fw-semibold text-secondary">Đi từ</label>
                            <select class="form-select" id="ditu">
                                <option selected>Hà nội</option>
                                <option value="DN">Đà Nẵng</option>
                                <option value="HCM">TP. Hồ Chí Minh</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="den" class="form-label mb-1 fw-semibold text-secondary">Đến</label>
                            <select class="form-select" id="den">
                                <option selected>Hà nội</option>
                                <option value="DN">Đà Nẵng</option>
                                <option value="HCM">TP. Hồ Chí Minh</option>
                            </select>
                        </div>
                    </div>

                    <!-- 4. Chọn chiều đi (Khứ hồi) -->
                    <div class="mb-4">
                        <label class="form-label mb-2 fw-semibold text-secondary d-block">Chọn chiều đi (Khứ hồi)</label>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="chieudi">
                            <label class="form-check-label text-secondary" for="chieudi">Đi</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="chieuve">
                            <label class="form-check-label text-secondary" for="chieuve">Về</label>
                        </div>
                    </div>

                    <!-- 5. Nút submit Đặt vé -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Đặt vé</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle (bao gồm Popper để nút đóng alert hoạt động) -->
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
